name: Generate Pacman Animation

on:
  # Allows manual execution from the Actions tab
  workflow_dispatch:

  # Automatically update Pac-Man every 12 hours
  schedule:
    - cron: "0 */12 * * *"

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # Generate Pac-Man contribution graph
      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # Push generated SVG files to pacman-output branch
      - name: Push Pacman Graph to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
